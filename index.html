<script>
const DEFAULTS=[{name:'Thumbnails + Titles',id:'PLG4bKYBmtC18',section:'Research'},{name:'More Thumbnails',id:'PLDXN39ABHfFA',section:'Research'},{name:'Outliers',id:'PLa_AIyLKyAnc',section:'Research'},{name:'Growth',id:'PLSE3i-cZdg0Y',section:'Growth'}];
const store={get videos(){return JSON.parse(localStorage.getItem('outclick.videos')||'[]')},set videos(v){localStorage.setItem('outclick.videos',JSON.stringify(v))},get lists(){return JSON.parse(localStorage.getItem('outclick.lists')||JSON.stringify(DEFAULTS))},set lists(v){localStorage.setItem('outclick.lists',JSON.stringify(v))}};
let page='explore',collection='All',query='',dark=false;let shuffleOrder=new Map();const $=s=>document.querySelector(s);function reshuffle(){shuffleOrder=new Map();for(const v of store.videos)shuffleOrder.set(v.id,Math.random())}function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),3500)}
function setup(){const m=$('#modalroot');m.innerHTML=`<div class="modal"><div class="panel"><h2>Connect your playlists</h2><p>Outclick reads unlisted playlists with your YouTube Data API key. Your key is stored only in this browser. Sync runs when you open this app or press Sync now.</p><div class="field"><label>YouTube Data API key</label><input id="apikey" type="password" placeholder="Paste API key"></div><div id="listfields"></div><div class="row"><button class="action" id="save">Save settings</button><button class="action secondary" id="sync">Save & sync now</button><button class="action secondary" id="close">Close</button></div><p style="font-size:12px">Keep the playlists unlisted. Anyone with an unlisted playlist link may be able to view it. Don’t publish this local app with your API key in it.</p></div></div>`;$('#apikey').value=localStorage.getItem('outclick.apiKey')||'';$('#listfields').innerHTML=store.lists.map((p,i)=>`<div class="field"><label>${p.name} playlist ID</label><input data-list="${i}" value="${p.id}"></div>`).join('');$('#save').onclick=()=>{localStorage.setItem('outclick.apiKey',$('#apikey').value.trim());store.lists=store.lists.map((p,i)=>({...p,id:document.querySelector(`[data-list="${i}"]`).value.trim()}));m.innerHTML='';toast('Settings saved')};$('#sync').onclick=async()=>{localStorage.setItem('outclick.apiKey',$('#apikey').value.trim());store.lists=store.lists.map((p,i)=>({...p,id:document.querySelector(`[data-list="${i}"]`).value.trim()}));m.innerHTML='';await sync()};$('#close').onclick=()=>m.innerHTML=''}
async function sync(){const key=localStorage.getItem('outclick.apiKey');if(!key){setup();return}toast('Syncing playlists…');let vids=store.videos;let got=0;try{for(const list of store.lists){if(!list.id)continue;let token='',items=[];do{const u=new URL('https://www.googleapis.com/youtube/v3/playlistItems');u.searchParams.set('part','snippet,contentDetails');u.searchParams.set('playlistId',list.id);u.searchParams.set('maxResults','50');u.searchParams.set('key',key);if(token)u.searchParams.set('pageToken',token);const res=await fetch(u);const data=await res.json();if(!res.ok)throw Error(data.error?.message||'YouTube API request failed');items.push(...data.items||[]);token=data.nextPageToken||''}while(token);const ids=items.map(x=>x.contentDetails?.videoId||x.snippet?.resourceId?.videoId).filter(Boolean);for(let i=0;i<ids.length;i+=50){const u=new URL('https://www.googleapis.com/youtube/v3/videos');u.searchParams.set('part','snippet,statistics,contentDetails');u.searchParams.set('id',ids.slice(i,i+50).join(','));u.searchParams.set('key',key);const res=await fetch(u);const d=await res.json();if(!res.ok)throw Error(d.error?.message||'Video details request failed');for(const v of d.items||[]){const s=v.snippet;let rec=vids.find(x=>x.id===v.id);if(!rec){rec={id:v.id,playlists:[]};vids.push(rec);got++}Object.assign(rec,{title:s.title,channel:s.channelTitle,channelId:s.channelId,thumbnail:s.thumbnails?.high?.url||s.thumbnails?.medium?.url||s.thumbnails?.default?.url,url:`https://www.youtube.com/watch?v=${v.id}`,published:s.publishedAt,views:Number(v.statistics?.viewCount||0),duration:v.contentDetails?.duration,lastSynced:new Date().toISOString()});if(!rec.playlists.includes(list.name))rec.playlists.push(list.name)}}}
store.videos=vids;reshuffle();render();toast(`Sync complete · ${got} new videos`)}catch(e){toast(`Sync failed: ${e.message}`)}}
function fmt(n){if(n>=1e9)return (n/1e9).toFixed(1).replace(/\.0$/,'')+'B';if(n>=1e6)return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M';if(n>=1e3)return (n/1e3).toFixed(1).replace(/\.0$/,'')+'K';return String(n)}function age(d){if(!d)return'';let sec=(Date.now()-new Date(d))/1000;if(sec<3600)return Math.max(1,Math.floor(sec/60))+'m ago';if(sec<86400)return Math.floor(sec/3600)+'h ago';if(sec<2592000)return Math.floor(sec/86400)+'d ago';if(sec<31536000)return Math.floor(sec/2592000)+'mo ago';return Math.floor(sec/31536000)+'y ago'}
function render(){const lists=store.lists, section=page==='growth'?'Growth':'Research';let visible=store.videos.filter(v=>v.playlists.some(n=>lists.find(p=>p.name===n)?.section===section));let groups=page==='library'?['Thumbnails','Titles','Outliers','All']:page==='growth'?['All','Creators to help']:['All','Thumbnails + Titles','More Thumbnails','Outliers'];if(page==='library'&&collection==='Thumbnails')visible=visible.filter(v=>v.playlists.some(n=>n.toLowerCase().includes('thumbnail')));if(page==='library'&&collection==='Titles')visible=visible.filter(v=>v.playlists.includes('Thumbnails + Titles'));if(collection!=='All'&&page!=='library')visible=visible.filter(v=>v.playlists.includes(collection));if(query)visible=visible.filter(v=>(v.title+v.channel+v.playlists.join(' ')).toLowerCase().includes(query));visible.sort((a,b)=>(shuffleOrder.get(a.id)??0)-(shuffleOrder.get(b.id)??0));$('#heading').textContent=page==='growth'?'Creators to help':page==='library'?'Your library':'Find your next thumbnail idea.';$('#subtitle').textContent=page==='growth'?'A dedicated space for creators you may want to work with.':page==='library'?'Browse your saved thumbnails, titles, and references.':'Browse by category. Find a structure. Make it your own.';$('#count').textContent=`${visible.length} videos`;$('#sortlabel').textContent=page==='growth'?'Growth collection':collection==='All'?'All inspiration':collection;$('#filters').innerHTML='<span class="filterlabel">'+(page==='library'?'Library':'Playlist')+'</span>'+groups.map(g=>`<button class="chip ${collection===g?'active':''}" data-col="${g}">${g}</button>`).join('');document.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{collection=b.dataset.col;reshuffle();render()});visible.sort((a,b)=>(shuffleOrder.get(a.id)??0)-(shuffleOrder.get(b.id)??0));visible.sort((a,b)=>(shuffleOrder.get(a.id)??0)-(shuffleOrder.get(b.id)??0));$('#grid').innerHTML=visible.map(v=>`<article class="video"><a href="${v.url}" target="_blank" rel="noopener"><img class="thumb" src="${v.thumbnail||''}" alt=""></a><div class="vidtitle" title="${esc(v.title)}">${esc(v.title)}</div><div class="meta"><span>${esc(v.channel)}</span><span>${fmt(v.views)} views · ${age(v.published)}</span></div><div class="tags">${v.playlists.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></article>`).join('');$('#empty').classList.toggle('hidden',visible.length>0);$('#grid').classList.toggle('hidden',visible.length===0)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;collection='All';reshuffle();document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));render()});$('#settings').onclick=$('#emptysettings').onclick=setup;$('#search').oninput=e=>{query=e.target.value.toLowerCase();render()};$('#theme').onclick=()=>{dark=!dark;document.body.classList.toggle('light',dark)};reshuffle();render();if(localStorage.getItem('outclick.apiKey'))sync();else if(!store.videos.length)setup();
</script>

<script>
(function(){
const main=document.querySelector('.main'),homeMarkup=main.innerHTML,KEY='outclick.channels',NOTES='outclick.researchNotes';
const oldRender=window.render;
const channels=()=>JSON.parse(localStorage.getItem(KEY)||'[]');
const saveChannels=x=>localStorage.setItem(KEY,JSON.stringify(x));
const notes=()=>JSON.parse(localStorage.getItem(NOTES)||'{}');
const saveNotes=x=>localStorage.setItem(NOTES,JSON.stringify(x));
let selectedChannel=localStorage.getItem('outclick.selectedChannel')||'';
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const apiKey=()=>localStorage.getItem('outclick.apiKey')||'';
async function api(url){const r=await fetch(url);const d=await r.json();if(!r.ok)throw Error(d.error?.message||'YouTube API request failed');return d}
function cidFrom(url){try{const u=new URL(url);const p=u.pathname.split('/').filter(Boolean);if(p[0]==='channel'&&p[1])return {id:p[1]};if(p[0]?.startsWith('@'))return {handle:p[0].slice(1)};if(p[0]==='@'&&p[1])return {handle:p[1]};return null}catch{return null}}
async function addChannel(){const input=document.querySelector('#channel-url'),url=input.value.trim();if(!url)return;const key=apiKey();if(!key){alert('Add your YouTube Data API key in Settings first.');document.querySelector('#settings').click();return}const parsed=cidFrom(url);if(!parsed){alert('Use a channel URL in the form youtube.com/@handle or youtube.com/channel/UC…');return}try{toast('Loading channel…');const u=new URL('https://www.googleapis.com/youtube/v3/channels');u.searchParams.set('part','snippet,statistics,contentDetails');if(parsed.id)u.searchParams.set('id',parsed.id);else u.searchParams.set('forHandle',parsed.handle);u.searchParams.set('key',key);const d=await api(u);const c=d.items?.[0];if(!c)throw Error('Channel not found. Check the link and try again.');let list=channels();if(list.some(x=>x.id===c.id)){selectedChannel=c.id;localStorage.setItem('outclick.selectedChannel',c.id);await syncChannel(c.id);renderGrowth();toast('Channel already saved · refreshed');return}const rec={id:c.id,title:c.snippet.title,description:c.snippet.description,thumbnail:c.snippet.thumbnails?.medium?.url||c.snippet.thumbnails?.default?.url||'',customUrl:c.snippet.customUrl||'',subscribers:Number(c.statistics?.subscriberCount||0),uploads:c.contentDetails?.relatedPlaylists?.uploads||'',addedAt:new Date().toISOString(),url};list.unshift(rec);saveChannels(list);selectedChannel=c.id;localStorage.setItem('outclick.selectedChannel',c.id);input.value='';await syncChannel(c.id);renderGrowth();toast('Channel added to your watchlist')}catch(e){toast(`Could not add channel: ${e.message}`)}}
function parseDuration(s){const m=(s||'').match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);return m?(+(m[1]||0)*3600+ +(m[2]||0)*60+ +(m[3]||0)):0}
async function syncChannel(id){const c=channels().find(x=>x.id===id);if(!c)return;const key=apiKey();if(!key)throw Error('Set your API key in Settings first.');let items=[];{const u=new URL('https://www.googleapis.com/youtube/v3/playlistItems');u.searchParams.set('part','snippet,contentDetails');u.searchParams.set('playlistId',c.uploads);u.searchParams.set('maxResults','50');u.searchParams.set('key',key);const d=await api(u);items.push(...(d.items||[]));token=d.nextPageToken||''}const ids=items.map(x=>x.contentDetails?.videoId).filter(Boolean);let vids=store.videos;for(let i=0;i<ids.length;i+=50){const u=new URL('https://www.googleapis.com/youtube/v3/videos');u.searchParams.set('part','snippet,statistics,contentDetails');u.searchParams.set('id',ids.slice(i,i+50).join(','));u.searchParams.set('key',key);const d=await api(u);for(const v of d.items||[]){let x=vids.find(y=>y.id===v.id);if(!x){x={id:v.id,playlists:[],sourceChannelIds:[]};vids.push(x)}Object.assign(x,{title:v.snippet.title,channel:v.snippet.channelTitle,channelId:v.snippet.channelId,thumbnail:v.snippet.thumbnails?.high?.url||v.snippet.thumbnails?.medium?.url||'',url:`https://www.youtube.com/watch?v=${v.id}`,published:v.snippet.publishedAt,views:Number(v.statistics?.viewCount||0),duration:v.contentDetails?.duration,durationSeconds:parseDuration(v.contentDetails?.duration),lastSynced:new Date().toISOString()});x.sourceChannelIds=x.sourceChannelIds||[];if(!x.sourceChannelIds.includes(c.id))x.sourceChannelIds.push(c.id)}}store.videos=vids}
function median(arr){if(!arr.length)return 0;const a=[...arr].sort((x,y)=>x-y),m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}
function fmt(n){if(typeof window.fmt==='function')return window.fmt(n);return Number(n||0).toLocaleString()}
function ago(d){const t=(Date.now()-new Date(d))/1000;if(t<3600)return Math.max(1,Math.floor(t/60))+'m ago';if(t<86400)return Math.floor(t/3600)+'h ago';if(t<2592000)return Math.floor(t/86400)+'d ago';if(t<31536000)return Math.floor(t/2592000)+'mo ago';return Math.floor(t/31536000)+'y ago'}
function baseline(id){const list=store.videos.filter(v=>(v.sourceChannelIds||[]).includes(id)&&v.durationSeconds>60).sort((a,b)=>new Date(b.published)-new Date(a.published)).slice(0,10);return {value:median(list.map(v=>v.views)),count:list.length}}
function signal(v,b){if(!b.value)return '<span class="signal">Baseline unavailable</span>';const x=v.views/b.value;let cl=x>=2?'high':x<.5?'low':'';let label=x>=2?'Outlier':x<.5?'Below usual':'In range';return `<span class="signal ${cl}">${label} · ${x.toFixed(1)}×</span><span class="signal">Recent long-form median (${b.count} videos): ${fmt(b.value)} views</span>`}
function renderGrowth(){const cs=channels();if(!cs.some(c=>c.id===selectedChannel))selectedChannel=cs[0]?.id||'';const c=cs.find(x=>x.id===selectedChannel);const allRefs=store.videos;main.innerHTML=`<div class="creator-head"><div><div class="eyebrow">Creator research</div><h1>Channels</h1><p class="sub">Add creators manually, then study their recent videos and packaging.</p></div><div class="count">${cs.length} channels</div></div><div class="creator-layout"><section class="creator-main"><div class="eyebrow">Add a channel</div><div class="channel-entry" style="margin-top:10px"><input id="channel-url" placeholder="Paste a YouTube channel URL (youtube.com/@handle)"><button class="primarybtn" id="add-channel">Add channel</button></div><div class="helper" style="margin-top:8px">Channel pages and @handles are supported. Channel uploads are fetched when added or refreshed.</div>${c?`<div class="section-kicker">${esc(c.title)} · recent uploads</div><div class="creator-head" style="align-items:center"><div class="helper">Long-form comparison uses the 10 most recent uploads over 60 seconds.</div><button class="softbtn" id="refresh-channel">↻ Sync videos</button></div><div id="creator-videos">${channelVideos(c)}</div>`:`<div class="creator-empty"><b>Your creator watchlist starts here</b><p>Add a channel URL to see its recent uploads and compare performance.</p></div>`}</section><section class="watchlist"><div class="watchlist-head"><span>Your Watchlist</span><span class="helper">${cs.length}</span></div>${cs.length?cs.map(x=>`<div class="channel-row ${x.id===selectedChannel?'selected':''}" data-channel="${esc(x.id)}"><img class="avatar" src="${esc(x.thumbnail)}"><div class="ch-info"><div class="ch-name">${esc(x.title)}</div><div class="ch-meta">${fmt(x.subscribers)} subscribers · added ${ago(x.addedAt)}</div></div><button class="softbtn" data-remove="${esc(x.id)}" title="Remove channel">×</button></div>`).join(''):`<div class="list-empty">Your added channels will appear here.</div>`}</section></div>`;
document.querySelector('#add-channel').onclick=addChannel;document.querySelector('#channel-url').onkeydown=e=>{if(e.key==='Enter')addChannel()};document.querySelectorAll('[data-channel]').forEach(x=>x.onclick=e=>{if(e.target.closest('[data-remove]'))return;selectedChannel=x.dataset.channel;localStorage.setItem('outclick.selectedChannel',selectedChannel);renderGrowth()});document.querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>{saveChannels(channels().filter(c=>c.id!==x.dataset.remove));if(selectedChannel===x.dataset.remove)selectedChannel=channels()[0]?.id||'';localStorage.setItem('outclick.selectedChannel',selectedChannel);renderGrowth()});const refresh=document.querySelector('#refresh-channel');if(refresh)refresh.onclick=async()=>{try{toast('Syncing channel videos…');await syncChannel(c.id);renderGrowth();toast('Channel videos updated')}catch(e){toast(`Sync failed: ${e.message}`)}};document.querySelectorAll('[data-note]').forEach(x=>x.onclick=()=>openReview(x.dataset.note));}
function channelVideos(c){const vids=store.videos.filter(v=>(v.sourceChannelIds||[]).includes(c.id)).sort((a,b)=>new Date(b.published)-new Date(a.published));if(!vids.length)return '<div class="creator-empty">No channel videos loaded yet. Select Sync videos to fetch uploads.</div>';const b=baseline(c.id);return vids.map(v=>{const n=notes()[v.id];return `<article class="creator-video"><a href="${esc(v.url)}" target="_blank" rel="noopener"><img src="${esc(v.thumbnail)}" alt=""></a><div><h3>${esc(v.title)}</h3><div class="cv-meta">${fmt(v.views)} views · ${ago(v.published)} · ${Math.floor(v.durationSeconds/60)} min</div>${signal(v,b)}<div class="small-actions"><button class="softbtn" data-note="${esc(v.id)}">Research / packaging note</button></div>${n?`<div class="note-card"><b>Research note${n.searchTerm?' · '+esc(n.searchTerm):''}</b>${esc(n.hypothesis||n.observation||'Saved')} ${n.refIds?.length?`<div class="helper" style="margin-top:5px">${n.refIds.length} library reference(s) linked</div>`:''}</div>`:''}</div></article>`}).join('')}
function openReview(id){const v=store.videos.find(x=>x.id===id);if(!v)return;const old=notes()[id]||{};const refs=store.videos.filter(x=>x.id!==id&&(x.playlists||[]).some(n=>/thumbnail|title/i.test(n)));const root=document.createElement('div');root.className='review-modal';root.innerHTML=`<div class="review-panel"><div class="eyebrow">Research notes</div><h2>${esc(v.title)}</h2><div class="helper">Separate what you observed from what you think might transfer.</div><label>Search term or discovery source</label><input id="rn-term" value="${esc(old.searchTerm||'')}" placeholder="e.g. YouTube growth for coaches"><label>What do you notice?</label><textarea id="rn-observation" placeholder="Record a pattern or audience problem">${esc(old.observation||'')}</textarea><label>Packaging hypothesis</label><textarea id="rn-hypothesis" placeholder="What alternative title/thumbnail direction could fit this creator?"></textarea><label>Library references</label><div class="ref-list">${refs.map(x=>`<label class="ref-item"><input type="checkbox" value="${esc(x.id)}" ${old.refIds?.includes(x.id)?'checked':''}><span>${esc(x.title)}<small class="helper"><br>${esc(x.channel)} · ${fmt(x.views)} views</small></span></label>`).join('')||'<div class="helper">Sync or import library videos to link examples.</div>'}</div><div class="row" style="justify-content:flex-end;margin-top:18px"><button class="softbtn" id="rn-cancel">Cancel</button><button class="primarybtn" id="rn-save">Save note</button></div></div>`;document.body.appendChild(root);root.onclick=e=>{if(e.target===root)root.remove()};root.querySelector('#rn-cancel').onclick=()=>root.remove();root.querySelector('#rn-save').onclick=()=>{const all=notes();all[id]={searchTerm:root.querySelector('#rn-term').value.trim(),observation:root.querySelector('#rn-observation').value.trim(),hypothesis:root.querySelector('#rn-hypothesis').value.trim(),refIds:[...root.querySelectorAll('.ref-item input:checked')].map(x=>x.value),updatedAt:new Date().toISOString()};saveNotes(all);root.remove();renderGrowth()}}
window.render=function(){if(page==='growth'){renderGrowth();return}if(!main.querySelector('#heading'))main.innerHTML=homeMarkup;oldRender();const s=document.querySelector('#search');if(s)s.oninput=e=>{query=e.target.value.toLowerCase();oldRender()};const empty=document.querySelector('#emptysettings');if(empty)empty.onclick=()=>document.querySelector('#settings').click()};
const growthButton=document.querySelector('[data-page="growth"]');if(growthButton){growthButton.innerHTML='<span class="navico">♙</span>Channels';growthButton.title='Creator research'}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{setTimeout(()=>{if(page==='growth')renderGrowth();else if(!main.querySelector('#heading'))main.innerHTML=homeMarkup},0)}));
})();
</script></body></html>
