const emojiRe=/(?:\p{Regional_Indicator}{2}|\p{Extended_Pictographic}(?:\uFE0F|\uFE0E)?(?:\u200D\p{Extended_Pictographic}(?:\uFE0F)?)*(?:\p{Emoji_Modifier})?)/gu;
function unified(e){return Array.from(e).map(c=>c.codePointAt(0).toString(16)).filter(x=>x!=='fe0f'&&x!=='fe0e').join('-').toLowerCase()}
function renderApple(text,size=14){return String(text??'').replace(emojiRe,m=>`<img class="emoji-img" src="https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.1.2/img/apple/64/${unified(m)}.png" width="${size}" height="${size}" alt="${esc(m)}" onerror="this.replaceWith(document.createTextNode(this.alt))">`).split(/(<img class="emoji-img"[^>]+>)/g).map(x=>x.startsWith('<img class="emoji-img"')?x:esc(x)).join('')}

function ago(d){if(!d)return'';const sec=(Date.now()-new Date(d))/1000;if(sec<3600)return Math.max(1,Math.floor(sec/60))+'m ago';if(sec<86400)return Math.floor(sec/3600)+'h ago';if(sec<2592000)return Math.floor(sec/86400)+'d ago';if(sec<31536000)return Math.floor(sec/2592000)+'mo ago';return Math.floor(sec/31536000)+'y ago'}
function duration(s){if(Number.isFinite(s)){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=Math.floor(s%60);return h?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${m}:${String(sec).padStart(2,'0')}`}const a=String(s||'').match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);return a?duration(+(a[1]||0)*3600+ +(a[2]||0)*60+ +(a[3]||0)):''}

// Small IndexedDB image store keeps uploaded research thumbnails persistent without filling localStorage.
let dbPromise;function imgDb(){if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{const q=indexedDB.open('outclick-local-assets',1);q.onupgradeneeded=()=>q.result.createObjectStore('images');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});return dbPromise}
async function saveImage(blob){const db=await imgDb(),id='img-'+crypto.randomUUID();return new Promise((resolve,reject)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').put(blob,id);tx.oncomplete=()=>resolve(id);tx.onerror=()=>reject(tx.error)})}
async function getImage(id){if(!id)return'';try{const db=await imgDb();return await new Promise((resolve,reject)=>{const q=db.transaction('images').objectStore('images').get(id);q.onsuccess=()=>resolve(q.result||'');q.onerror=()=>reject(q.error)})}catch{return''}}
const objectUrls=new Map();async function imgSrc(r){if(r.imageId){if(objectUrls.has(r.imageId))return objectUrls.get(r.imageId);const blob=await getImage(r.imageId);if(blob){const u=URL.createObjectURL(blob);objectUrls.set(r.imageId,u);return u}}return r.thumbnailUrl||''}

function renderResearch(){const rows=currentRows(),all=store.rows,breakN=all.filter(r=>r.outcome==='breakout').length,underN=all.filter(r=>r.outcome==='underperformer').length,viral=all.filter(r=>Number(r.multiplier)>=10).length;$('#main').innerHTML=`<section class="page"><div class="research-head"><div class="research-title"><div class="table-icon">${icon('table')}</div><h1>Research</h1></div><div class="view-tabs"><button class="view-tab ${S.researchView==='All Research'?'active':''}" data-research-view="All Research">All Research</button><button class="view-tab ${S.researchView==='Breakouts'?'active':''}" data-research-view="Breakouts">Breakouts <span class="badge-count">${breakN}</span></button><button class="view-tab ${S.researchView==='Underperformers'?'active':''}" data-research-view="Underperformers">Underperformers <span class="badge-count red">${underN}</span></button><button class="view-tab ${S.researchView==='10x+ Viral'?'active':''}" data-research-view="10x+ Viral">${renderApple('🚀',13)} 10x+ Viral <span class="badge-count">${viral}</span></button><button class="view-tab" id="addResearchTab">${icon('plus')} Add</button></div></div><div class="research-toolbar"><div class="toolleft"><button class="toolbtn" data-pop="group">${icon('layers')} Group by <span>${S.groupBy==='None'?'':esc(S.groupBy)}</span></button><button class="toolbtn" data-pop="filters">${icon('filter')} Filters</button><button class="toolbtn" data-pop="fields">${icon('columns')} Fields</button><button class="toolbtn" id="rowHeight">${icon('rows')} Row height</button></div><div class="toolright"><input class="search-small" id="pageSearch" placeholder="Search research..." value="${esc(S.query)}"><button class="compare-btn ${S.selected.length===2?'enabled':''}" id="compareBtn" ${S.selected.length===2?'':'disabled'}>Compare Pair${S.selected.length?` · ${S.selected.length}`:''}</button></div></div><div class="table-wrap ${S.rowHeight}" id="tableWrap"><table><thead><tr><th class="checkcell"><input type="checkbox" id="selectVisible" title="Select all visible"></th>${COLS.filter(c=>colVisible(c[0])).map(([k,n])=>`<th data-sort="${k}">${esc(n)}${S.sortKey===k?(S.sortDir>0?' ↑':' ↓'):''}</th>`).join('')}</tr></thead><tbody id="researchBody">${renderTableRows(rows)}</tbody></table></div></section>`;bindResearch();hydrateResearchImages()}function renderTableRows(rows){if(!rows.length)return `<tr><td colspan="10"><div class="empty-state" style="margin:20px"><h2>No research rows here yet</h2><p>Add a row and fill it in directly below.</p><button class="btn btn-primary" id="emptyAdd">${icon('plus')} Add row</button></div></td></tr>`;let sorted=rows;if(S.groupBy!=='None'){const groups=new Map();rows.forEach(r=>{const k=S.groupBy==='Search term'?(r.searchTerm||'No search term'):S.groupBy==='Outcome'?(r.outcome||'Unreviewed'):r.channel||'Unknown channel';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)});sorted=[...groups.entries()].flatMap(([g,list])=>[{__group:g},...list])}return sorted.map(r=>{if(r.__group)return `<tr class="group-row"><td colspan="10">${esc(r.__group)}</td></tr>`;const checked=S.selected.includes(r.id);return `<tr data-row="${esc(r.id)}"><td class="checkcell"><input type="checkbox" data-select="${esc(r.id)}" ${checked?'checked':''}></td>${colVisible('searchTerm')?`<td data-edit-cell="searchTerm" data-row-id="${esc(r.id)}"><span class="term-pill">${renderApple(r.searchTerm||'Add search term',12)}</span></td>`:''}${colVisible('thumbnail')?`<td class="thumb-cell" data-thumb-upload="${esc(r.id)}">${r.imageId||r.thumbnailUrl?`<img class="sheet-thumb" data-row-thumb="${esc(r.id)}" data-image-id="${esc(r.imageId||'')}" src="${esc(r.thumbnailUrl||'')}" alt="" loading="lazy">`:`<button class="thumb-empty" type="button">Add image</button>`}</td>`:''}${colVisible('title')?`<td class="title-cell" data-edit-cell="title" data-row-id="${esc(r.id)}">${renderApple(r.title||'Add video title',14)}</td>`:''}${colVisible('link')?`<td data-edit-cell="link" data-row-id="${esc(r.id)}"><span class="link-cell">${r.link?'Edit link':'Add link'}</span>${r.link?` <a href="${esc(r.link)}" target="_blank" rel="noopener" title="Open on YouTube">${icon('external')}</a>`:''}</td>`:''}${colVisible('channel')?`<td data-edit-cell="channel" data-row-id="${esc(r.id)}">${renderApple(r.channel||'Add channel',12)}</td>`:''}${colVisible('views')?`<td data-edit-cell="views" data-row-id="${esc(r.id)}">${r.views!==''&&r.views!=null?fmt(r.views):'Add views'}</td>`:''}${colVisible('multiplier')?`<td data-edit-cell="multiplier" data-row-id="${esc(r.id)}"><div class="multiplier-cell"><span class="multiplier-text">${r.multiplier!==''&&r.multiplier!=null?`${Number(r.multiplier).toFixed(1).replace(/\.0$/,'')}×`:'Add multiplier'}</span>${outcomeTag(r)}</div></td>`:''}${colVisible('datePosted')?`<td data-edit-cell="datePosted" data-row-id="${esc(r.id)}">${esc(r.datePosted||'Add date')}</td>`:''}${colVisible('topic')?`<td class="topic-cell" title="${esc(r.topic||'')}" data-edit-cell="topic" data-row-id="${esc(r.id)}">${renderApple(r.topic||'Add topic',12)}</td>`:''}</tr>`}).join('')}
async function hydrateResearchImages(){for(const img of $$('[data-image-id]')){if(!img.getAttribute('src')||img.getAttribute('src')===location.href){const r=rowById(img.closest('[data-row]')?.dataset.row);if(r?.imageId){const src=await imgSrc(r);if(src)img.src=src}}}}
function bindResearch(){$$('[data-research-view]').forEach(b=>b.onclick=()=>{S.researchView=b.dataset.researchView;S.selected=[];nav();render()});$('#addResearchTab')?.addEventListener('click',()=>addResearchRow());$('#pageSearch')?.addEventListener('input',e=>{S.query=e.target.value;const pos=e.target.selectionStart;render();const input=$('#pageSearch');input?.focus();input?.setSelectionRange(pos,pos)});$('#emptyAdd')?.addEventListener('click',()=>addResearchRow());$('#compareBtn')?.addEventListener('click',openCompare);$('#rowHeight')?.addEventListener('click',()=>{S.rowHeight=S.rowHeight==='compact'?'comfortable':'compact';localStorage.setItem('outclick.rowHeight',S.rowHeight);render()});$$('[data-pop]').forEach(b=>b.onclick=()=>openPopover(b.dataset.pop,b));$$('[data-sort]').forEach(b=>b.onclick=()=>{const k=b.dataset.sort;S.sortDir=S.sortKey===k?-S.sortDir:1;S.sortKey=k;render()});$$('[data-select]').forEach(c=>c.onchange=()=>{if(c.checked)S.selected=[...new Set([...S.selected,c.dataset.select])];else S.selected=S.selected.filter(x=>x!==c.dataset.select);render()});$('#selectVisible')?.addEventListener('change',e=>{S.selected=e.target.checked?currentRows().map(r=>r.id):[];render()});$$('[data-edit-cell]').forEach(c=>c.addEventListener('click',e=>{if(e.target.closest('a,button'))return;startCellEdit(c)}));$$('[data-thumb-upload]').forEach(c=>c.addEventListener('click',()=>startThumbUpload(c.dataset.thumbUpload)));$('#researchBody')?.addEventListener('click',e=>{const b=e.target.closest('[data-outcome]');if(!b)return;e.stopPropagation();const r=rowById(b.dataset.outcome);if(!r)return;r.outcome=r.outcome===''?'breakout':r.outcome==='breakout'?'underperformer':'';store.rows=store.rows.map(x=>x.id===r.id?r:x);paintResearchCell(b.closest('[data-edit-cell]'),r,'multiplier')});$('#researchBody')?.addEventListener('mousemove',showHover);$('#researchBody')?.addEventListener('mouseleave',()=>$('#hoverPreview').style.display='none')}function addResearchRow(prefill={}){S.page='research';S.researchView='All Research';S.query='';const id=crypto.randomUUID();store.rows=[{id,videoId:prefill.videoId||'',searchTerm:prefill.searchTerm||'',title:prefill.title||'',link:prefill.link||'',thumbnailUrl:prefill.thumbnail||'',imageId:'',channel:prefill.channel||'',views:prefill.views??'',multiplier:'',datePosted:prefill.datePosted||'',topic:'',outcome:'',createdAt:new Date().toISOString()},...store.rows];nav();render();const cell=$(`[data-row-id="${CSS.escape(id)}"][data-edit-cell="searchTerm"]`);if(cell)startCellEdit(cell)}
function paintResearchCell(cell,row,key){if(key==='searchTerm')cell.innerHTML=`<span class="term-pill">${renderApple(row.searchTerm||'Add search term',12)}</span>`;else if(key==='title')cell.innerHTML=renderApple(row.title||'Add video title',14);else if(key==='link')cell.innerHTML=`<span class="link-cell">${row.link?'Edit link':'Add link'}</span>${row.link?` <a href="${esc(row.link)}" target="_blank" rel="noopener" title="Open on YouTube">${icon('external')}</a>`:''}`;else if(key==='channel')cell.innerHTML=renderApple(row.channel||'Add channel',12);else if(key==='views')cell.textContent=row.views!==''&&row.views!=null?fmt(row.views):'Add views';else if(key==='multiplier')cell.innerHTML=`<div class="multiplier-cell"><span class="multiplier-text">${row.multiplier!==''&&row.multiplier!=null?`${Number(row.multiplier).toFixed(1).replace(/\.0$/,'')}×`:'Add multiplier'}</span>${outcomeTag(row)}</div>`;else if(key==='datePosted')cell.textContent=row.datePosted||'Add date';else if(key==='topic'){cell.textContent=row.topic||'Add topic';cell.title=row.topic||''}delete cell.dataset.editing}
function startCellEdit(cell){if(cell.dataset.editing)return;const id=cell.dataset.rowId,key=cell.dataset.editCell,row=rowById(id);if(!row)return;cell.dataset.editing='1';const value=row[key]??'';const type=key==='datePosted'?'date':(['views','multiplier'].includes(key)?'number':'text');cell.innerHTML=`<input class="cell-editor" type="${type}" value="${esc(value)}" ${key==='views'||key==='multiplier'?'min="0" step="0.1"':''} aria-label="Edit ${esc(key)}">`;const input=cell.querySelector('input');input.focus();if(type==='text')input.select();const save=()=>{if(!cell.dataset.editing)return;const updated=input.value.trim();if(key==='views'||key==='multiplier')row[key]=updated===''?'':Number(updated);else row[key]=updated;if(key==='link')row.videoId=vidId(updated);store.rows=store.rows.map(x=>x.id===row.id?row:x);paintResearchCell(cell,row,key)};input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();save();const next=cell.parentElement.querySelector(`[data-edit-cell]:nth-of-type(${cell.cellIndex+2})`);if(next)setTimeout(()=>next.click(),0)}if(e.key==='Escape'){e.preventDefault();paintResearchCell(cell,row,key)}};input.onblur=save}function startThumbUpload(id){const input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=async()=>{const file=input.files?.[0];if(!file)return;try{const blob=await compressImage(file),imageId=await saveImage(blob);const row=rowById(id);if(row){row.imageId=imageId;row.thumbnailUrl='';store.rows=store.rows.map(x=>x.id===id?row:x);render()}}catch{toast('Could not save that image in this browser')}};input.click()}function openPopover(kind,anchor){$$('.popover').forEach(x=>x.remove());const p=document.createElement('div');p.className='popover';const rect=anchor.getBoundingClientRect();p.style.top=(rect.bottom+5)+'px';p.style.left=Math.min(rect.left,innerWidth-260)+'px';if(kind==='group')p.innerHTML=`<div style="font-size:11px;color:#71717a;margin-bottom:5px">GROUP BY</div>${['None','Search term','Outcome','Channel'].map(x=>`<label><input type="radio" name="group" value="${x}" ${S.groupBy===x?'checked':''}>${x}</label>`).join('')}`;else if(kind==='fields')p.innerHTML=`<div style="font-size:11px;color:#71717a;margin-bottom:5px">VISIBLE FIELDS</div>${COLS.map(([k,n])=>`<label><input type="checkbox" data-field="${k}" ${colVisible(k)?'checked':''}>${n}</label>`).join('')}`;else p.innerHTML=`<div style="font-size:11px;color:#71717a;margin-bottom:5px">FILTER RESEARCH</div><label>Search term</label><select id="filterTerm"><option>All</option>${[...new Set(store.rows.map(r=>r.searchTerm).filter(Boolean))].map(x=>`<option ${S.termFilter===x?'selected':''}>${esc(x)}</option>`).join('')}</select><label>Outcome</label><select id="filterOutcome"><option>All</option><option ${S.outcomeFilter==='Breakouts'?'selected':''}>Breakouts</option><option ${S.outcomeFilter==='Underperformers'?'selected':''}>Underperformers</option></select><label>Minimum multiplier</label><input id="filterMultiplier" type="number" min="0" step="0.1" value="${esc(S.minMultiplier)}" placeholder="Any"><div class="popover-actions"><button class="btn" id="clearFilters">Clear</button><button class="btn btn-primary" id="applyFilters">Apply</button></div>`;document.body.append(p);p.querySelectorAll('[name=group]').forEach(x=>x.onchange=()=>{S.groupBy=x.value;p.remove();render()});p.querySelectorAll('[data-field]').forEach(x=>x.onchange=()=>{S.fields[x.dataset.field]=x.checked;localStorage.setItem('outclick.fields',JSON.stringify(S.fields));render()});p.querySelector('#applyFilters')?.addEventListener('click',()=>{S.termFilter=p.querySelector('#filterTerm').value;S.outcomeFilter=p.querySelector('#filterOutcome').value;S.minMultiplier=p.querySelector('#filterMultiplier').value;p.remove();render()});p.querySelector('#clearFilters')?.addEventListener('click',()=>{S.termFilter='All';S.outcomeFilter='All';S.minMultiplier='';p.remove();render()});setTimeout(()=>document.addEventListener('click',function close(e){if(!p.contains(e.target)&&!anchor.contains(e.target)){p.remove();document.removeEventListener('click',close)}},{once:true}),0)}
function showHover(e){const i=e.target.closest('[data-row-thumb]');if(!i){$('#hoverPreview').style.display='none';return}const p=$('#hoverPreview');p.src=i.src;p.style.left=Math.min(e.clientX+15,innerWidth-335)+'px';p.style.top=Math.min(e.clientY+10,innerHeight-200)+'px';p.style.display='block'}
async function compressImage(file){if(!file.type.startsWith('image/'))throw Error('Not an image');const bitmap=await createImageBitmap(file),scale=Math.min(1,1280/bitmap.width),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);return await new Promise(res=>canvas.toBlob(res,'image/jpeg',.88))}
function openCompare(){const chosen=S.selected.map(rowById).filter(Boolean);if(chosen.length!==2)return;const root=document.createElement('div');root.className='modal-backdrop';root.innerHTML=`<div class="modal"><div class="drawer-head"><h2>Compare research pair</h2><button class="close-btn" id="closeCompare">${icon('close')}</button></div><div class="compare-grid">${chosen.map(r=>`<article class="compare-card"><img src="${esc(r.thumbnailUrl||'')}" alt=""><span class="outcome-tag ${r.outcome==='breakout'?'breakout':'under'}">${r.outcome==='breakout'?'Breakout':r.outcome==='underperformer'?'Underperformer':'Unreviewed'}</span><h3>${renderApple(r.title,14)}</h3><div class="stats">${esc(r.channel)} · ${fmt(r.views)} views · ${r.multiplier?Number(r.multiplier).toFixed(1)+'×':'No multiplier'}</div><p>${renderApple(r.topic||'No topic note yet',13)}</p></article>`).join('')}</div><p style="font-size:12px;color:#71717a">Compare the evidence and your notes. Performance labels are research classifications, not explanations of cause.</p></div>`;$('#overlayRoot').append(root);$('#closeCompare').onclick=()=>root.remove();root.onclick=e=>{if(e.target===root)root.remove()}}

function render(){nav();if(S.page==='explore')renderExplore();else if(S.page==='library')renderLibrary();else renderResearch()}
function filterSearch(){if(S.page==='research')renderResearch();else if(S.page==='explore')renderExplore();else renderLibrary();const i=$( '#globalSearch' );if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}

async function syncPlaylists(){const key=localStorage.getItem('outclick.apiKey');if(!key){openSettings();return}toast('Syncing playlists…');let vids=store.videos;let added=0;try{for(const list of store.playlists){if(!list.id)continue;let token='',items=[];do{const u=new URL('https://www.googleapis.com/youtube/v3/playlistItems');u.searchParams.set('part','snippet,contentDetails');u.searchParams.set('playlistId',list.id);u.searchParams.set('maxResults','50');u.searchParams.set('key',key);if(token)u.searchParams.set('pageToken',token);const r=await fetch(u),d=await r.json();if(!r.ok)throw Error(d.error?.message||'Playlist request failed');items.push(...(d.items||[]));token=d.nextPageToken||''}while(token);const ids=items.map(x=>x.contentDetails?.videoId||x.snippet?.resourceId?.videoId).filter(Boolean);for(let i=0;i<ids.length;i+=50){const u=new URL('https://www.googleapis.com/youtube/v3/videos');u.searchParams.set('part','snippet,statistics,contentDetails');u.searchParams.set('id',ids.slice(i,i+50).join(','));u.searchParams.set('key',key);const r=await fetch(u),d=await r.json();if(!r.ok)throw Error(d.error?.message||'Video request failed');for(const v of d.items||[]){let rec=vids.find(x=>x.id===v.id);if(!rec){rec={id:v.id,playlists:[],sourceChannelIds:[]};vids.push(rec);added++}Object.assign(rec,{title:v.snippet.title,channel:v.snippet.channelTitle,channelId:v.snippet.channelId,thumbnail:v.snippet.thumbnails?.high?.url||v.snippet.thumbnails?.medium?.url||v.snippet.thumbnails?.default?.url||'',url:`https://www.youtube.com/watch?v=${v.id}`,published:v.snippet.publishedAt,views:Number(v.statistics?.viewCount||0),duration:v.contentDetails?.duration,durationSeconds:durationSeconds(v.contentDetails?.duration),lastSynced:new Date().toISOString()});if(!rec.playlists.includes(list.name))rec.playlists.push(list.name)}}}store.videos=vids;S.shuffle=new Map(vids.map(v=>[v.id,Math.random()]));render();toast(`Sync complete · ${added} new videos`)}catch(e){toast('Sync failed: '+e.message)}}
function durationSeconds(d){const m=String(d||'').match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);return m?+(m[1]||0)*3600+ +(m[2]||0)*60+ +(m[3]||0):0}
function openSettings(){const root=document.createElement('div');root.className='modal-backdrop';root.innerHTML=`<div class="modal" style="max-width:560px"><div class="drawer-head"><h2>Settings</h2><button class="close-btn" id="closeSettings">${icon('close')}</button></div><p style="font-size:12px;color:#71717a">Your API key and library data stay in this browser. Keep playlist links unlisted and restrict the API key to this site's domain.</p><div class="field"><label>YouTube Data API key</label><input id="apiKeyInput" type="password" value="${esc(localStorage.getItem('outclick.apiKey')||'')}" placeholder="Paste API key"></div><div class="field"><label>Research playlists</label><div id="playlistSettings">${store.playlists.map((p,i)=>`<div class="field"><label>${esc(p.name)}</label><input data-plid="${i}" value="${esc(p.id)}" placeholder="Playlist ID"></div>`).join('')}</div></div><div class="drawer-footer"><button class="btn" id="syncSettings">Save & Sync</button><div><button class="btn" id="cancelSettings">Cancel</button><button class="btn btn-primary" id="saveSettings">Save settings</button></div></div></div>`;$('#overlayRoot').append(root);const close=()=>root.remove();$('#closeSettings').onclick=$('#cancelSettings').onclick=close;const save=async sync=>{localStorage.setItem('outclick.apiKey',$('#apiKeyInput').value.trim());store.playlists=store.playlists.map((p,i)=>({...p,id:root.querySelector(`[data-plid="${i}"]`).value.trim()}));close();if(sync)await syncPlaylists();else toast('Settings saved')};$('#saveSettings').onclick=()=>save(false);$('#syncSettings').onclick=()=>save(true);root.onclick=e=>{if(e.target===root)close()}}

function bindGlobal(){initShell();$('#globalSearch').addEventListener('input',e=>{S.query=e.target.value;filterSearch()});$('#collapseBtn').onclick=()=>{S.collapsed=!S.collapsed;$('#app').classList.toggle('collapsed',S.collapsed);localStorage.setItem('outclick.sidebarCollapsed',S.collapsed?'1':'0');$('#collapseIcon').innerHTML=icon(S.collapsed?'expand':'collapse')};$('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');$('#themeBtn').innerHTML=icon(document.body.classList.contains('dark')?'sun':'moon');localStorage.setItem('outclick.theme',document.body.classList.contains('dark')?'dark':'light')};if(localStorage.getItem('outclick.theme')==='dark')document.body.classList.add('dark');$('#settingsBtn').onclick=openSettings;$$('[data-page]').forEach(b=>b.onclick=()=>changePage(b.dataset.page,b.dataset.view));$('#quickAddResearch').onclick=()=>addResearchRow();$('#pinSearchBtn').onclick=openPinModal;$$('[data-toggle-group]').forEach(b=>b.onclick=()=>{const n=b.dataset.toggleGroup,box=n==='research'?$('#researchNav'):$('#pinnedList');box.classList.toggle('hidden')});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch').focus()}if(e.key==='Escape'){$$('.menu,.popover,.drawer-backdrop,.modal-backdrop').forEach(x=>x.remove())}});document.addEventListener('click',e=>{const menuBtn=e.target.closest('[data-video-menu]');if(menuBtn){e.preventDefault();e.stopPropagation();videoMenu(menuBtn.dataset.videoMenu);return}const act=e.target.closest('[data-card-action]');if(act){const v=store.videos.find(x=>x.id===act.dataset.id);if(act.dataset.cardAction==='open'&&v)window.open(v.url,'_blank','noopener');if(act.dataset.cardAction==='save'&&v){store.saved=store.saved.includes(v.id)?store.saved.filter(x=>x!==v.id):[...store.saved,v.id];toast(store.saved.includes(v.id)?'Saved to Library':'Removed from Library')}if(act.dataset.cardAction==='copy'&&v)navigator.clipboard?.writeText(v.title).then(()=>toast('Title copied'));if(act.dataset.cardAction==='research'&&v){const existing=store.rows.find(r=>r.videoId===v.id);if(existing){S.page='research';S.researchView='All Research';S.query='';nav();render()}else addResearchRow({videoId:v.id,title:v.title,link:v.url,thumbnail:v.thumbnail,channel:v.channel,views:v.views,datePosted:(v.published||'').slice(0,10)})}$$('.menu').forEach(x=>x.remove());return}if(!e.target.closest('.menu,.kebab-wrap,.popover'))$$('.menu,.popover').forEach(x=>x.remove())});}
function openPinModal(){const root=document.createElement('div');root.className='modal-backdrop';root.innerHTML=`<div class="modal" style="max-width:390px"><div class="drawer-head"><h2>Pin a search</h2><button class="close-btn" id="pinClose">${icon('close')}</button></div><div class="field"><label>Search term</label><input id="pinTerm" value="${esc(S.query)}" placeholder="e.g. creator growth"></div><div class="field"><label>Emoji (optional)</label><input id="pinEmoji" maxlength="8" placeholder="🔍"></div><div class="drawer-footer"><span></span><button class="btn btn-primary" id="pinSave">Pin search</button></div></div>`;$('#overlayRoot').append(root);$('#pinClose').onclick=()=>root.remove();$('#pinSave').onclick=()=>{const term=$('#pinTerm').value.trim();if(!term)return toast('Enter a search term');store.pinned=[...store.pinned.filter(p=>p.term!==term),{term,emoji:$('#pinEmoji').value.trim()}];root.remove();renderPinned();toast('Search pinned')}}

function normalizeRows(){let rows=store.rows;if(!rows.length){const seen=new Set();for(const v of store.videos){if(!v.playlists?.some(n=>store.playlists.find(p=>p.name===n)?.section==='Research'))continue;rows.push({id:'playlist-'+v.id,videoId:v.id,searchTerm:'',title:v.title,link:v.url,thumbnailUrl:v.thumbnail,channel:v.channel,views:v.views,multiplier:'',datePosted:(v.published||'').slice(0,10),topic:'',outcome:'',createdAt:v.lastSynced||new Date().toISOString()});seen.add(v.id)}store.rows=rows}}
bindGlobal();normalizeRows();render();if(localStorage.getItem('outclick.apiKey')){}else if(!store.videos.length)toast('Open Settings to connect your YouTube playlists');
</script></body></html>
