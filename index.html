<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outclick YouTube</title>
<style>
:root{--ink:#111;--muted:#6e7075;--line:#e8e8e8;--soft:#f3f3f4;--red:#ff0033;--bg:#fff;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Arial,Helvetica,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;color:inherit}.top{height:70px;padding:0 24px;border-bottom:1px solid #f2f2f2;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);z-index:5}.brand{display:flex;align-items:center;gap:10px;font-size:19px;letter-spacing:-.6px}.brand b{font-weight:750}.brand span{font-weight:400}.yt-icon{width:34px;height:25px;border-radius:7px;background:var(--red);display:grid;place-items:center}.yt-icon:after{content:"";width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid white;margin-left:2px}.top-right{margin-left:auto;display:flex;gap:10px;align-items:center}.pill,.iconbtn{border-radius:99px;background:var(--soft);padding:10px 15px;font-size:12px}.iconbtn{width:38px;height:38px;padding:0;font-size:18px}.layout{display:grid;grid-template-columns:92px 1fr;min-height:calc(100vh - 70px)}aside{padding:13px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}nav button{width:76px;height:78px;border-radius:14px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:11px;color:#4e5054}nav button.active{background:#f2f2f3;color:#111;font-weight:600}nav .navico{font-size:22px;line-height:1}nav .growth{margin-top:auto}.main{padding:34px 30px 60px;max-width:1600px;width:100%;margin:auto}.eyebrow{font-size:10px;letter-spacing:1.7px;color:#63666b;text-transform:uppercase;font-weight:600}.hero{display:flex;align-items:end;justify-content:space-between;padding:0 0 28px;border-bottom:1px solid var(--line)}h1{margin:10px 0 5px;font-size:31px;letter-spacing:-1.2px;line-height:1.15}.sub{margin:0;color:#555b63}.count{color:#333;font-size:12px;white-space:nowrap}.controls{padding:20px 0;border-bottom:1px solid var(--line)}.filterrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.filterlabel{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#666;margin-right:9px}.chip{background:#f2f2f3;padding:9px 14px;border-radius:10px;font-size:12px}.chip.active{background:#111;color:white}.toolbar{display:flex;justify-content:space-between;align-items:center;padding:18px 0;color:#555;font-size:12px}.search{border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:min(270px,50vw);outline:none}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 10px}.video{min-width:0}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#eee;display:block}.vidtitle{font-size:14px;line-height:1.35;font-weight:600;margin:9px 0 5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:12px;color:#74777c;display:flex;justify-content:space-between;gap:6px}.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.tag{background:#f0f0f0;color:#555;border-radius:5px;padding:2px 6px;font-size:10px}.empty{padding:45px 20px;text-align:center;color:#777;border:1px dashed #ddd;border-radius:12px}.empty h2{color:#222}.hidden{display:none!important}.panel{max-width:600px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 12px 40px #0001}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:10;padding:20px}.panel h2{margin:0 0 10px}.panel p{color:#62666b}.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}.field input{border:1px solid #ddd;border-radius:8px;padding:11px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.action{background:#111;color:white;border-radius:9px;padding:10px 15px}.secondary{background:#eee;color:#111}.playlistline{padding:13px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:white;border-radius:10px;padding:12px 18px;z-index:20}.outlier{color:#b82434}.light{--bg:#171819;--ink:#f4f4f4;--line:#333;--soft:#292a2b}.light .chip{background:#292a2b}.light .chip.active{background:#fafafa;color:#111}.light .tag{background:#303030;color:#ddd}.light .panel{background:#202122}.light .field input{background:#181818;color:white;border-color:#444}.light .empty{border-color:#444}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.layout{grid-template-columns:64px 1fr}aside{padding:10px 4px}nav button{width:54px;height:62px;font-size:10px}.main{padding:24px 15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 8px}h1{font-size:25px}.hero{align-items:flex-start;gap:12px}.count{padding-top:30px}}
</style></head><body>
<header class="top"><div class="brand"><i class="yt-icon"></i><div><b>Outclick</b> <span>YouTube</span></div></div><div class="top-right"><button class="iconbtn" id="theme" title="Toggle theme">☾</button><button class="pill" id="settings">⚙ Settings</button></div></header>
<div class="layout"><aside><nav><button class="active" data-page="explore"><span class="navico">◎</span>Explore</button><button data-page="library"><span class="navico">▥</span>Library</button><button data-page="growth" class="growth"><span class="navico">♙</span>Growth</button></nav></aside><main class="main"><section class="hero"><div><div class="eyebrow">The creator's collection</div><h1 id="heading">Find your next thumbnail idea.</h1><p class="sub" id="subtitle">Browse by category. Find a structure. Make it your own.</p></div><div class="count" id="count">0 videos</div></section><section class="controls"><div class="filterrow" id="filters"><span class="filterlabel">Collection</span></div></section><div class="toolbar"><div id="sortlabel">All inspiration</div><input class="search" id="search" placeholder="Search titles, channels…"></div><div class="grid" id="grid"></div><div class="empty hidden" id="empty"><h2>Your library starts here</h2><p>Connect your YouTube playlists in Settings to import the videos you’ve saved.</p><button class="action" id="emptysettings">Connect playlists</button></div></main></div>
<div id="modalroot"></div><div class="toast hidden" id="toast"></div>
<script>
const DEFAULTS=[{name:'Thumbnails + Titles',id:'PLG4bKYBmtC18',section:'Research'},{name:'More Thumbnails',id:'PLDXN39ABHfFA',section:'Research'},{name:'Outliers',id:'PLa_AIyLKyAnc',section:'Research'},{name:'Growth',id:'PLSE3i-cZdg0Y',section:'Growth'}];
const store={get videos(){return JSON.parse(localStorage.getItem('outclick.videos')||'[]')},set videos(v){localStorage.setItem('outclick.videos',JSON.stringify(v))},get lists(){return JSON.parse(localStorage.getItem('outclick.lists')||JSON.stringify(DEFAULTS))},set lists(v){localStorage.setItem('outclick.lists',JSON.stringify(v))}};
let page='explore',collection='All',query='',dark=false;let shuffleOrder=new Map();const $=s=>document.querySelector(s);function reshuffle(){shuffleOrder=new Map();for(const v of store.videos)shuffleOrder.set(v.id,Math.random())}function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),3500)}
function setup(){const m=$('#modalroot');m.innerHTML=`<div class="modal"><div class="panel"><h2>Connect your playlists</h2><p>Outclick reads unlisted playlists with your YouTube Data API key. Your key is stored only in this browser. Sync runs when you open this app or press Sync now.</p><div class="field"><label>YouTube Data API key</label><input id="apikey" type="password" placeholder="Paste API key"></div><div id="listfields"></div><div class="row"><button class="action" id="save">Save settings</button><button class="action secondary" id="sync">Save & sync now</button><button class="action secondary" id="close">Close</button></div><p style="font-size:12px">Keep the playlists unlisted. Anyone with an unlisted playlist link may be able to view it. Don’t publish this local app with your API key in it.</p></div></div>`;$('#apikey').value=localStorage.getItem('outclick.apiKey')||'';$('#listfields').innerHTML=store.lists.map((p,i)=>`<div class="field"><label>${p.name} playlist ID</label><input data-list="${i}" value="${p.id}"></div>`).join('');$('#save').onclick=()=>{localStorage.setItem('outclick.apiKey',$('#apikey').value.trim());store.lists=store.lists.map((p,i)=>({...p,id:document.querySelector(`[data-list="${i}"]`).value.trim()}));m.innerHTML='';toast('Settings saved')};$('#sync').onclick=async()=>{localStorage.setItem('outclick.apiKey',$('#apikey').value.trim());store.lists=store.lists.map((p,i)=>({...p,id:document.querySelector(`[data-list="${i}"]`).value.trim()}));m.innerHTML='';await sync()};$('#close').onclick=()=>m.innerHTML=''}
async function sync(){const key=localStorage.getItem('outclick.apiKey');if(!key){setup();return}toast('Syncing playlists…');let vids=store.videos;let got=0;try{for(const list of store.lists){if(!list.id)continue;let token='',items=[];do{const u=new URL('https://www.googleapis.com/youtube/v3/playlistItems');u.searchParams.set('part','snippet,contentDetails');u.searchParams.set('playlistId',list.id);u.searchParams.set('maxResults','50');u.searchParams.set('key',key);if(token)u.searchParams.set('pageToken',token);const res=await fetch(u);const data=await res.json();if(!res.ok)throw Error(data.error?.message||'YouTube API request failed');items.push(...data.items||[]);token=data.nextPageToken||''}while(token);const ids=items.map(x=>x.contentDetails?.videoId||x.snippet?.resourceId?.videoId).filter(Boolean);for(let i=0;i<ids.length;i+=50){const u=new URL('https://www.googleapis.com/youtube/v3/videos');u.searchParams.set('part','snippet,statistics,contentDetails');u.searchParams.set('id',ids.slice(i,i+50).join(','));u.searchParams.set('key',key);const res=await fetch(u);const d=await res.json();if(!res.ok)throw Error(d.error?.message||'Video details request failed');for(const v of d.items||[]){const s=v.snippet;let rec=vids.find(x=>x.id===v.id);if(!rec){rec={id:v.id,playlists:[]};vids.push(rec);got++}Object.assign(rec,{title:s.title,channel:s.channelTitle,channelId:s.channelId,thumbnail:s.thumbnails?.high?.url||s.thumbnails?.medium?.url||s.thumbnails?.default?.url,url:`https://www.youtube.com/watch?v=${v.id}`,published:s.publishedAt,views:Number(v.statistics?.viewCount||0),duration:v.contentDetails?.duration,lastSynced:new Date().toISOString()});if(!rec.playlists.includes(list.name))rec.playlists.push(list.name)}}}
store.videos=vids;reshuffle();render();toast(`Sync complete · ${got} new videos`)}catch(e){toast(`Sync failed: ${e.message}`)}}
function fmt(n){if(n>=1e9)return (n/1e9).toFixed(1).replace(/\.0$/,'')+'B';if(n>=1e6)return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M';if(n>=1e3)return (n/1e3).toFixed(1).replace(/\.0$/,'')+'K';return String(n)}function age(d){if(!d)return'';let sec=(Date.now()-new Date(d))/1000;if(sec<3600)return Math.max(1,Math.floor(sec/60))+'m ago';if(sec<86400)return Math.floor(sec/3600)+'h ago';if(sec<2592000)return Math.floor(sec/86400)+'d ago';if(sec<31536000)return Math.floor(sec/2592000)+'mo ago';return Math.floor(sec/31536000)+'y ago'}
function render(){const lists=store.lists, section=page==='growth'?'Growth':'Research';let visible=store.videos.filter(v=>v.playlists.some(n=>lists.find(p=>p.name===n)?.section===section));let groups=page==='library'?['Thumbnails','Titles','Outliers','All']:page==='growth'?['All','Creators to help']:['All','Thumbnails + Titles','More Thumbnails','Outliers'];if(page==='library'&&collection==='Thumbnails')visible=visible.filter(v=>v.playlists.some(n=>n.toLowerCase().includes('thumbnail')));if(page==='library'&&collection==='Titles')visible=visible.filter(v=>v.playlists.includes('Thumbnails + Titles'));if(collection!=='All'&&page!=='library')visible=visible.filter(v=>v.playlists.includes(collection));if(query)visible=visible.filter(v=>(v.title+v.channel+v.playlists.join(' ')).toLowerCase().includes(query));visible.sort((a,b)=>(shuffleOrder.get(a.id)??0)-(shuffleOrder.get(b.id)??0));$('#heading').textContent=page==='growth'?'Creators to help':page==='library'?'Your library':'Find your next thumbnail idea.';$('#subtitle').textContent=page==='growth'?'A dedicated space for creators you may want to work with.':page==='library'?'Browse your saved thumbnails, titles, and references.':'Browse by category. Find a structure. Make it your own.';$('#count').textContent=`${visible.length} videos`;$('#sortlabel').textContent=page==='growth'?'Growth collection':collection==='All'?'All inspiration':collection;$('#filters').innerHTML='<span class="filterlabel">'+(page==='library'?'Library':'Playlist')+'</span>'+groups.map(g=>`<button class="chip ${collection===g?'active':''}" data-col="${g}">${g}</button>`).join('');document.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{collection=b.dataset.col;reshuffle();render()});visible.sort((a,b)=>(shuffleOrder.get(a.id)??0)-(shuffleOrder.get(b.id)??0));$('#grid').innerHTML=visible.map(v=>`<article class="video"><a href="${v.url}" target="_blank" rel="noopener"><img class="thumb" src="${v.thumbnail||''}" alt=""></a><div class="vidtitle" title="${esc(v.title)}">${esc(v.title)}</div><div class="meta"><span>${esc(v.channel)}</span><span>${fmt(v.views)} views · ${age(v.published)}</span></div><div class="tags">${v.playlists.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></article>`).join('');$('#empty').classList.toggle('hidden',visible.length>0);$('#grid').classList.toggle('hidden',visible.length===0)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;collection='All';reshuffle();reshuffle();document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));render()});$('#settings').onclick=$('#emptysettings').onclick=setup;$('#search').oninput=e=>{query=e.target.value.toLowerCase();render()};$('#theme').onclick=()=>{dark=!dark;document.body.classList.toggle('light',dark)};reshuffle();render();if(localStorage.getItem('outclick.apiKey'))sync();else if(!store.videos.length)setup();
</script></body></html>
